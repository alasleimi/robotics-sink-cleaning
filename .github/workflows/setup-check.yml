name: Setup checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.8"
      - name: Install pinned tools and check Python/Java
        run: uv run --locked scripts/setup.py
      - name: Check setup helpers and PGLfD geometry
        run: uv run --locked pytest -q tests third_party/pglfd/python/tests/geom
      - name: Compile simulator adapter and test teaching files
        run: uv run --locked python scripts/check_java.py
      - name: Run original exercises against robosuite / MuJoCo physics
        run: uv run --locked scripts/check_simulation.py
      - name: Record with hand-guiding and replay through Sunrise API
        run: uv run --locked scripts/check_recording.py
      - name: Train KMP and TP-KMP and replay in the washbasin scene
        run: uv run --locked scripts/check_learning.py
      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-logs-${{ matrix.os }}
          path: |
            .tools/sim-*/*.log
            .tools/sim-*/*report.json
            .tools/sim-*/models/comparison.png
          retention-days: 7
