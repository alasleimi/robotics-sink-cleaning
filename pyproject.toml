[project]
name = "robotics-sink-cleaning"
version = "0.1.0"
description = "Course exercises and demonstration learning for the KUKA iiwa sink-cleaning project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "matplotlib>=3.10,<4",
    "coppeliasim-zmqremoteapi-client>=2.0.4,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["learning/sinkcleaning", "third_party/pglfd/python/pglfd"]

[tool.hatch.build]
dev-mode-dirs = ["learning", "third_party/pglfd/python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
