[tool.ruff]
line-length = 127
# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203", "D212", "D213", "COM812", "ISC001", "N803", "N806", # formatting stuff
    "INP001", # implicit namespaces
    "PLR2004", # magic numbers
    "D401", # imperative mood
    "ANN401", # dynamic typing
    "PLR0913", # too many arguments
    "S311", # cryptography
    "TD002", "TD003", "TD004", # TODOS
    "T201", # print
    "PTH", # omit path issues for now - TODO reintroduce?
    "FIX002", "D100", # omit todos for now - TODO reintroduce!
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S301", "SLF001", "RET504", "PLR0915", "ANN", "D", "NPY002"]
"tests/model/test_data.py" = ["ERA001"]
"tests/model/test_lqt.py" = ["ERA001"]
"**/__init__.py" = ["D104"]

[tool.mypy]
disable_error_code = ["import-not-found"]
ignore_missing_imports = true
follow_imports = "silent"
show_error_codes = true
